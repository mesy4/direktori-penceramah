<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direktori Penceramah PRN N9</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-[#0B1B3D] text-slate-100 font-sans min-h-screen pb-20 antialiased selection:bg-amber-400 selection:text-blue-950">

  <!-- Header Banner -->
  <header class="p-6 text-center border-b border-blue-900/60 bg-gradient-to-b from-[#0F234D] to-[#0B1B3D]">
    <div class="max-w-2xl mx-auto">
      <span class="inline-block bg-amber-400 text-blue-950 text-[10px] font-black uppercase px-3.5 py-1 rounded-full mb-3 tracking-widest shadow-sm">
        Bilik Gerakan PRN Negeri Sembilan
      </span>
      <h1 class="text-2xl md:text-3xl font-black tracking-tight text-white uppercase">
        Direktori & Jadual Penceramah
      </h1>
      <p class="text-xs text-blue-200 mt-1.5 leading-relaxed">
        Pangkalan data penceramah bagi permohonan permit IPD/PDRM & SPR DUN
      </p>

      <!-- Quick Document Links -->
      <div class="mt-5 flex flex-col sm:flex-row gap-2.5 justify-center">
        <a href="https://docs.google.com/document/d/1myhdcVMsTva0V2IE6ZsrjYZhZWDLXk5nhy3dYrfXYak/edit?usp=sharing" target="_blank" 
           class="py-2.5 px-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-file-lines text-amber-400"></i> Google Docs Rasmi
        </a>
        <button onclick="openModal()" 
           class="py-2.5 px-4 bg-amber-400 hover:bg-amber-300 text-blue-950 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition shadow">
          <i class="fa-solid fa-user-plus"></i> Tambah Penceramah
        </button>
      </div>
    </div>
  </header>

  <!-- Controls Container -->
  <div class="max-w-2xl mx-auto px-4 mt-6 space-y-3.5">
    <!-- Live Search Input -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
      <input type="text" id="search" placeholder="Cari nama, No. KP, DUN kawasan, atau jawatan..." 
        class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-9 pr-4 py-3 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-amber-400 transition" />
    </div>

    <!-- Filter Pills for DUN/Tempat -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs" id="filterPills">
      <button onclick="setFilter('SEMUA')" class="pill-btn active-pill px-3 py-1.5 rounded-lg bg-amber-400 text-blue-950 font-bold transition">Semua</button>
      <button onclick="setFilter('AMPANGAN')" class="pill-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition">AMPANGAN</button>
      <button onclick="setFilter('BAGAN PINANG')" class="pill-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition">BAGAN PINANG</button>
    </div>
  </div>

  <!-- Cards List -->
  <main id="speakerContainer" class="max-w-2xl mx-auto px-4 mt-4 space-y-3.5">
    <div class="text-center py-16 text-xs text-blue-300">
      <i class="fa-solid fa-spinner fa-spin text-lg text-amber-400 mb-2"></i>
      <p>Menyambung ke Google Sheets...</p>
    </div>
  </main>

  <!-- Modal Form: Tambah Penceramah (Writes to Google Sheet) -->
  <div id="addModal" class="fixed inset-0 bg-black/75 hidden items-center justify-center p-4 z-50">
    <div class="glass border border-slate-700 max-w-md w-full rounded-2xl p-6 text-xs shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-base">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <h2 class="text-base font-extrabold text-white mb-1">Daftar Penceramah Baharu</h2>
      <p class="text-slate-400 mb-4">Data ini akan disimpan terus ke dalam Google Sheet Master.</p>

      <form id="speakerForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
        <div>
          <label class="text-slate-300 block mb-1 font-medium">Nama Penuh Penceramah</label>
          <input type="text" id="formNama" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-slate-300 block mb-1 font-medium">No. Kad Pengenalan</label>
            <input type="text" id="formIC" required placeholder="Contoh: 900925035701" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 font-mono" />
          </div>
          <div>
            <label class="text-slate-300 block mb-1 font-medium">No. Telefon</label>
            <input type="text" id="formTel" required placeholder="Contoh: 0195597066" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 font-mono" />
          </div>
        </div>
        <div>
          <label class="text-slate-300 block mb-1 font-medium">Jawatan / Jawatan Politik</label>
          <input type="text" id="formJawatan" required placeholder="Contoh: AJK PAS Pusat / Ahli Parlimen" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-slate-300 block mb-1 font-medium">DUN / Tempat</label>
            <input type="text" id="formTempat" required placeholder="Contoh: AMPANGAN" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white uppercase focus:outline-none focus:border-amber-400" />
          </div>
          <div>
            <label class="text-slate-300 block mb-1 font-medium">Tarikh Bertugas</label>
            <input type="text" id="formTarikh" required placeholder="YYYY-MM-DD → YYYY-MM-DD" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 font-mono text-[11px]" />
          </div>
        </div>
        <div class="pt-2">
          <button type="submit" id="submitBtn" class="w-full py-3 bg-amber-400 hover:bg-amber-300 text-blue-950 font-bold rounded-xl transition">
            Simpan ke Google Sheet
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT WEB APP ANDA DI SINI:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwt-i0wrZsMBTcGbmvMCYSfy5MMfS5BoCMo7oEPvLLxBZVdXbatKT2UKHK6x_duNAc/exec";

    // Data sandaran awal (fallback) dari jadual anda
    const fallbackData = [
      { bil: "1", nama: "Muhammad Farid", jawatan: "Naib Ketua Ulamak Kawasan Seremban", ic: "900925035701", tel: "0145701319", tempat: "AMPANGAN", tarikh: "2026-07-19 → 2026-07-19" },
      { bil: "1", nama: "Najihatussalehah Ahmad", jawatan: "Ajk PAS PUSAT/ADUN BOTA/KPEN DMPM", ic: "661115085066", tel: "0195597066", tempat: "BAGAN PINANG", tarikh: "2026-07-19 → 2026-07-19" },
      { bil: "2", nama: "Mohd Hasnizan Bin Harun", jawatan: "Ahli Parlimen Hulu Selangor / Timbalan Pesuruhjaya 3 Selangor", ic: "700605-08-5201", tel: "0196505201", tempat: "AMPANGAN", tarikh: "2026-07-27 → 2026-07-30" },
      { bil: "3", nama: "Nor Najwa Hidayah binti Amir", jawatan: "Ketua Penerangan Dewan Muslimat Pas Wilayah Persekutuan", ic: "910405086424", tel: "0195424381", tempat: "BAGAN PINANG", tarikh: "2026-07-19 → 2026-07-19" }
    ];

    let allSpeakers = [];
    let activeFilter = "SEMUA";

    async function loadSpeakers() {
      try {
        const response = await fetch(SCRIPT_URL);
        if (!response.ok) throw new Error("Gagal mengambil data");
        const data = await response.json();
        allSpeakers = data && data.length > 0 ? data : fallbackData;
      } catch (err) {
        console.warn("Menggunakan data sandaran lokal:", err);
        allSpeakers = fallbackData;
      }
      buildLocationPills();
      filterAndRender();
    }

    function buildLocationPills() {
      const places = Array.from(new Set(allSpeakers.map(s => (s.tempat || "").trim().toUpperCase()).filter(Boolean)));
      const pillsContainer = document.getElementById("filterPills");
      let html = `<button onclick="setFilter('SEMUA')" class="pill-btn ${activeFilter === 'SEMUA' ? 'bg-amber-400 text-blue-950 font-bold' : 'bg-slate-800 text-slate-300 border border-slate-700'} px-3 py-1.5 rounded-lg transition">Semua</button>`;
      
      places.forEach(p => {
        const active = activeFilter === p;
        html += `<button onclick="setFilter('${p}')" class="pill-btn ${active ? 'bg-amber-400 text-blue-950 font-bold' : 'bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700'} px-3 py-1.5 rounded-lg transition">${p}</button>`;
      });
      pillsContainer.innerHTML = html;
    }

    function setFilter(loc) {
      activeFilter = loc;
      buildLocationPills();
      filterAndRender();
    }

    function copyPermitData(btn, s) {
      const permitFormat = `NAMA: ${s.nama}\nNO. KAD PENGENALAN: ${s.ic}\nNO. TELEFON: ${s.tel}\nJAWATAN: ${s.jawatan}\nTEMPAT/DUN: ${s.tempat}\nTARIKH: ${s.tarikh}`;
      navigator.clipboard.writeText(permitFormat);
      const original = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> Disalin!`;
      setTimeout(() => btn.innerHTML = original, 1500);
    }

    function filterAndRender() {
      const query = document.getElementById("search").value.toLowerCase().trim();
      const filtered = allSpeakers.filter(s => {
        const matchLoc = activeFilter === "SEMUA" || (s.tempat && s.tempat.toUpperCase() === activeFilter);
        const matchQuery = !query || 
          (s.nama && s.nama.toLowerCase().includes(query)) ||
          (s.ic && s.ic.includes(query)) ||
          (s.tel && s.tel.includes(query)) ||
          (s.jawatan && s.jawatan.toLowerCase().includes(query)) ||
          (s.tempat && s.tempat.toLowerCase().includes(query));
        return matchLoc && matchQuery;
      });

      const container = document.getElementById("speakerContainer");
      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 text-xs py-12">Tiada rekod kelapangan penceramah dijumpai.</p>`;
        return;
      }

      container.innerHTML = filtered.map(s => {
        const cleanTel = (s.tel || "").replace(/[^0-9]/g, '');
        return `
          <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 shadow-sm hover:border-slate-600 transition">
            <div class="flex items-start justify-between gap-3 border-b border-slate-700/80 pb-3">
              <div class="flex-1">
                <div class="flex items-center gap-2 mb-1">
                  <span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">
                    ${s.tempat || 'DUN'}
                  </span>
                  <span class="text-[10px] text-slate-400 font-mono">Bil: ${s.bil || '-'}</span>
                </div>
                <h2 class="font-bold text-white text-sm">${s.nama}</h2>
                <p class="text-amber-400 text-xs font-medium leading-relaxed">${s.jawatan}</p>
              </div>
              <button onclick='copyPermitData(this, ${JSON.stringify(s)})' class="shrink-0 bg-blue-900/60 hover:bg-blue-800 text-blue-200 border border-blue-700 text-[11px] font-semibold px-2.5 py-1.5 rounded-lg transition flex items-center gap-1.5">
                <i class="fa-regular fa-copy"></i> Salin
              </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-slate-300 pt-3">
              <div>
                <span class="text-slate-400 text-[11px] block">No. Kad Pengenalan:</span>
                <span class="font-mono text-white font-medium">${s.ic}</span>
              </div>
              <div>
                <span class="text-slate-400 text-[11px] block">No. Telefon:</span>
                <div class="flex items-center gap-2 mt-0.5">
                  <a href="tel:${cleanTel}" class="text-amber-300 font-mono hover:underline">${s.tel}</a>
                  <a href="https://wa.me/60${cleanTel.replace(/^0/, '')}" target="_blank" class="text-emerald-400 hover:text-emerald-300 text-xs" title="WhatsApp">
                    <i class="fa-brands fa-whatsapp"></i>
                  </a>
                </div>
              </div>
              <div class="sm:col-span-2 bg-slate-900/70 rounded-xl p-2.5 border border-slate-800 flex items-center justify-between">
                <span class="text-slate-400 text-[11px]"><i class="fa-regular fa-calendar-days text-amber-400 mr-1.5"></i>Tarikh Kelapangan:</span>
                <span class="font-mono text-xs font-semibold text-emerald-300">${s.tarikh}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Menyimpan...`;

      const payload = {
        nama: document.getElementById("formNama").value.trim(),
        ic: document.getElementById("formIC").value.trim(),
        tel: document.getElementById("formTel").value.trim(),
        jawatan: document.getElementById("formJawatan").value.trim(),
        tempat: document.getElementById("formTempat").value.trim().toUpperCase(),
        tarikh: document.getElementById("formTarikh").value.trim()
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors", // Required for Google Apps Script Web App redirects
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        // Add to local state immediately
        payload.bil = (allSpeakers.length + 1).toString();
        allSpeakers.unshift(payload);
        closeModal();
        document.getElementById("speakerForm").reset();
        buildLocationPills();
        filterAndRender();
        alert("Penceramah berjaya didaftarkan ke Google Sheet!");
      } catch (err) {
        alert("Ralat semasa menyimpan: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `Simpan ke Google Sheet`;
      }
    }

    function openModal() {
      document.getElementById("addModal").classList.remove("hidden");
      document.getElementById("addModal").classList.add("flex");
    }
    function closeModal() {
      document.getElementById("addModal").classList.add("hidden");
      document.getElementById("addModal").classList.remove("flex");
    }

    document.getElementById("search").addEventListener("input", filterAndRender);
    loadSpeakers();
  </script>
</body>
</html>
