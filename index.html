<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borang Penceramah PN PRN Melaka 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-20">

  <!-- Header Banner -->
  <header class="bg-[#173059] text-white py-6 px-4 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <img src="https://flagcdn.com/w80/my.png" alt="Bendera Malaysia" class="w-12 h-8 md:w-16 md:h-10 object-cover rounded shadow-sm opacity-90" />
      <div class="text-center px-2">
        <h1 class="text-lg md:text-2xl font-bold tracking-tight text-white">
          Borang Penceramah PN PRN Melaka 2026
        </h1>
        <p class="text-xs md:text-sm text-sky-300 font-medium mt-1">
          Perikatan Nasional — Melaka
        </p>
      </div>
      <img src="https://flagcdn.com/w80/my.png" alt="Bendera Malaysia" class="w-12 h-8 md:w-16 md:h-10 object-cover rounded shadow-sm opacity-90" />
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">

    <!-- 1. Borang Pendaftaran Penceramah -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
      <form id="penceramahForm" onsubmit="handleSubmit(event)" class="space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Tarikh Mula</label>
            <input type="date" id="tarikhMula" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-700 focus:outline-none focus:ring-1 focus:ring-blue-800 focus:border-blue-800" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Tarikh Akhir</label>
            <input type="date" id="tarikhAkhir" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-700 focus:outline-none focus:ring-1 focus:ring-blue-800 focus:border-blue-800" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Tempat</label>
          <select id="tempat" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-700 focus:outline-none focus:ring-1 focus:ring-blue-800 focus:border-blue-800">
            <option value="" disabled selected>-- Pilih Tempat --</option>
            <option value="BUKIT KATIL">Bukit Katil</option>
            <option value="PAYA RUMPUT">Paya Rumput</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nama</label>
            <input type="text" id="nama" required placeholder="Contoh: Muhammad Farid" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-700 focus:outline-none focus:ring-1 focus:ring-blue-800 focus:border-blue-800" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Jawatan</label>
            <input type="text" id="jawatan" required placeholder="Contoh: Naib Ketua Ulamak Kawasan" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-700 focus:outline-none focus:ring-1 focus:ring-blue-800 focus:border-blue-800" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">No Telefon (Dia/PA)</label>
            <input type="text" id="noTel" required placeholder="Contoh: 0145701319" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-700 focus:outline-none focus:ring-1 focus:ring-blue-800 focus:border-blue-800 font-mono" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">No Kad Pengenalan</label>
            <input type="text" id="noKP" required placeholder="Cth: 800101-01-1234" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-800 focus:border-blue-800 font-mono" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Sedia Ceramah Berapa Tempat</label>
          <input type="text" id="sediaBerapa" placeholder="Cth: 2 Tempat" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-700 focus:outline-none focus:ring-1 focus:ring-blue-800 focus:border-blue-800" />
        </div>

        <div class="flex justify-end pt-2">
          <button type="submit" id="btnHantar" class="bg-[#1b3864] hover:bg-[#132847] text-white text-xs font-bold px-7 py-2.5 rounded-lg shadow-sm transition active:scale-95">
            Hantar
          </button>
        </div>
      </form>
    </div>

    <!-- 2. Kotak WhatsApp Pengesahan IC -->
    <div class="bg-[#e9f2fd] border border-[#bfdcfc] rounded-xl p-4 md:p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-lg bg-blue-100/70 border border-blue-200 flex items-center justify-center text-blue-600 text-lg shrink-0">
          <i class="fa-regular fa-image"></i>
        </div>
        <div>
          <h2 class="text-xs font-bold text-slate-900">Hantar Kad Pengenalan</h2>
          <p class="text-[11px] text-blue-600 mt-0.5">
            Sila hantar gambar kad pengenalan penceramah melalui WhatsApp untuk pengesahan urus setia.
          </p>
        </div>
      </div>
      <a href="https://wa.me/60195597066?text=Pengesahan%20Penceramah%20PN%20Melaka" target="_blank" class="bg-[#1b3864] hover:bg-[#132847] text-white text-[11px] font-semibold px-4 py-2.5 rounded-lg shrink-0 text-center transition shadow-sm">
        Hantar Gambar via WhatsApp
      </a>
    </div>

    <!-- 3. Jadual Penceramah -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-[#dce8f5] text-[#1b3864] font-bold border-b border-blue-100">
              <th class="py-3.5 px-4 font-bold">Nama</th>
              <th class="py-3.5 px-4 font-bold">Jawatan</th>
              <th class="py-3.5 px-4 font-bold">No KP</th>
              <th class="py-3.5 px-4 font-bold">No Tel</th>
              <th class="py-3.5 px-4 font-bold">Tempat</th>
              <th class="py-3.5 px-4 font-bold text-center">Tarikh</th>
              <th class="py-3.5 px-3 font-bold text-center">Bil.</th>
              <th class="py-3.5 px-4 font-bold text-center">Tindakan</th>
            </tr>
          </thead>
          <tbody id="penceramahTableBody" class="divide-y divide-slate-100 text-slate-700">
            <!-- Data dari Google Sheet dimasukkan di sini -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Script Segerak Google Sheet -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwt-i0wrZsMBTcGbmvMCYSfy5MMfS5BoCMo7oEPvLLxBZVdXbatKT2UKHK6x_duNAc/exec";
    let speakerList = [];

    async function loadData() {
      const tbody = document.getElementById("penceramahTableBody");
      tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-blue-800 text-sm mb-1"></i><br>Menyegerak data dari Google Sheet...</td></tr>`;

      try {
        const res = await fetch(`${SCRIPT_URL}?_=${Date.now()}`);
        if (!res.ok) throw new Error("Gagal menyambung");
        const data = await res.json();
        speakerList = Array.isArray(data) ? data : [];
      } catch (e) {
        console.error("Ralat pangkalan data:", e);
        speakerList = [];
      }
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("penceramahTableBody");
      
      if (speakerList.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-12 text-slate-400">
              <i class="fa-regular fa-folder-open text-2xl text-slate-300 mb-2"></i>
              <p>Pangkalan data kosong. Tiada rekod penceramah dijumpai di Google Sheet.</p>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = speakerList.map((item, idx) => {
        const cleanTel = (item.tel || "").replace(/[^0-9]/g, '');
        const dateFormatted = (item.tarikh || "").replace(/→|->/g, '\n→\n');

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3.5 px-4 font-medium text-slate-900 align-top">${item.nama}</td>
            <td class="py-3.5 px-4 text-slate-600 align-top leading-relaxed">${item.jawatan}</td>
            <td class="py-3.5 px-4 font-mono text-slate-700 align-top">${item.ic}</td>
            <td class="py-3.5 px-4 font-mono text-slate-700 align-top">
              <a href="tel:${cleanTel}" class="hover:underline text-blue-900 font-semibold">${item.tel}</a>
            </td>
            <td class="py-3.5 px-4 uppercase font-semibold text-slate-700 align-top">${item.tempat}</td>
            <td class="py-3.5 px-4 text-center font-mono text-[11px] text-slate-600 align-top whitespace-pre-line">${dateFormatted}</td>
            <td class="py-3.5 px-3 text-center text-slate-700 align-top">${item.bil || (idx + 1)}</td>
            <td class="py-3.5 px-4 text-center align-top">
              <div class="flex flex-col items-center gap-0.5">
                <button onclick="salinMaklumat(${idx})" class="text-blue-600 hover:text-blue-800 font-medium">Salin</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function salinMaklumat(index) {
      const s = speakerList[index];
      const text = `NAMA: ${s.nama}\nNO. KAD PENGENALAN: ${s.ic}\nNO. TEL: ${s.tel}\nJAWATAN: ${s.jawatan}\nTEMPAT: ${s.tempat}\nTARIKH: ${s.tarikh.replace(/\n/g, ' ')}`;
      navigator.clipboard.writeText(text);
      alert(`Maklumat ${s.nama} telah disalin!`);
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnHantar");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Menyimpan ke Google Sheet...`;

      const tMula = document.getElementById("tarikhMula").value;
      const tAkhir = document.getElementById("tarikhAkhir").value;
      const tarikhGabung = `${tMula} → ${tAkhir}`;

      const newSpeaker = {
        nama: document.getElementById("nama").value.trim(),
        jawatan: document.getElementById("jawatan").value.trim(),
        ic: document.getElementById("noKP").value.trim(),
        tel: document.getElementById("noTel").value.trim(),
        tempat: document.getElementById("tempat").value,
        tarikh: tarikhGabung
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(newSpeaker)
        });

        alert("Data berjaya disimpan ke Google Sheet!");
        document.getElementById("penceramahForm").reset();
        
        setTimeout(loadData, 1500);
      } catch (err) {
        alert("Ralat menghantar borang: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `Hantar`;
      }
    }

    loadData();
  </script>
</body>
</html>
